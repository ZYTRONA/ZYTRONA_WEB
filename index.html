    <script>
      // Fix Permissions policy violation for deprecated 'unload' event (Chrome bfcache deprecation)
      (function() {
        if (typeof window !== 'undefined') {
          if (window.addEventListener) {
            const _origAdd = window.addEventListener;
            window.addEventListener = function(type, listener, options) {
              if (type === 'unload') {
                return _origAdd.call(this, 'pagehide', listener, options);
              }
              return _origAdd.call(this, type, listener, options);
            };
          }
          if (window.removeEventListener) {
            const _origRemove = window.removeEventListener;
            window.removeEventListener = function(type, listener, options) {
              if (type === 'unload') {
                return _origRemove.call(this, 'pagehide', listener, options);
              }
              return _origRemove.call(this, type, listener, options);
            };
          }
          try {
            Object.defineProperty(window, 'onunload', {
              get() { return null; },
              set(fn) {
                if (typeof fn === 'function') {
                  window.addEventListener('pagehide', fn);
                }
              },
              configurable: true,
              enumerable: true
            });
          } catch (e) {}
        }
      })();
    </script>
